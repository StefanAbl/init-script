kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-from-external-ingress
spec:
  policyTypes:
  - Ingress
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          # Repointed from external-ingress to the NGINX Gateway Fabric data plane.
          # Both gateways share the nginx-gateway namespace.
          kubernetes.io/metadata.name: nginx-gateway
