kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-from-external-ingress
spec:
  policyTypes:
  - Ingress
  podSelector: {}
  ingress:
  - from:
    # See allow-from-ingress: scoped to the external Gateway's data-plane pods
    # so that admitting public traffic does not also admit the internal gateway
    # (and vice versa). namespaceSelector + podSelector in a single peer is an AND.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nginx-gateway
      podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: nginx-external
