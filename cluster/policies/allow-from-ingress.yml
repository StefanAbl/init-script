kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-from-ingress
spec:
  policyTypes:
  - Ingress
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          # Repointed from ingress-nginx to the NGINX Gateway Fabric data plane.
          kubernetes.io/metadata.name: nginx-gateway
