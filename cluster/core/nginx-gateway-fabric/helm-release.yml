apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=oci://ghcr.io/nginx/charts
      chart: nginx-gateway-fabric
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
      interval: 5m
  # CRDs are owned by the gateway-api Kustomization (cluster/gateway-api-crds),
  # which must install them before core can be dry-run. Skip here so helm-controller
  # and kustomize-controller don't both manage the same CRDs.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    nginxGateway:
      gatewayClassName: nginx
      # Snippets are enabled ONLY for the gateway-wide brotli request deny in
      # snippets-policy.yml, which has no native equivalent. Everything else
      # uses native Gateway API / NGF policies; do not add further snippets.
      snippets:
        enable: true
