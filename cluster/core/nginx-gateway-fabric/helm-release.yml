apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=oci://ghcr.io/nginx/charts
      chart: nginx-gateway-fabric
      version: 2.6.6
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
      interval: 5m
  # CRDs are owned by the gateway-api Kustomization (cluster/gateway-api-crds),
  # which must install them before core can be dry-run. Skip here so helm-controller
  # and kustomize-controller don't both manage the same CRDs.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    nginxGateway:
      gatewayClassName: nginx
      # Snippets are intentionally left DISABLED (chart default): the migration
      # re-expresses every ingress-nginx annotation with native Gateway API /
      # NGF policies instead of raw nginx snippets.
