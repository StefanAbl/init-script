####################################################################
# Internal gateway — replaces core/ingress-nginx (class "nginx").
# LoadBalancer IP 10.13.2.30 (first-pool), internal *.k3s.i.${DOMAIN}.
####################################################################
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: internal-proxy
  namespace: nginx-gateway
spec:
  kubernetes:
    service:
      type: LoadBalancer
      # NOTE: use-forwarded-headers / rewriteClientIP is intentionally NOT set.
      # The out-of-cluster proxy is gone, so there is no trusted proxy in front
      # and trusting client-supplied X-Forwarded-For would be a spoofing risk.
      patches:
        - type: StrategicMerge
          value:
            metadata:
              annotations:
                # Pin the historical internal ingress IP so LAN clients / UniFi
                # devices / DNS keep working. Shared with the L4 LoadBalancer
                # Services (UniFi STUN/inform, CoreDNS) via allow-shared-ip.
                metallb.universe.tf/loadBalancerIPs: 10.13.2.30
                metallb.universe.tf/allow-shared-ip: k3s-internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-internal
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: internal-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.k3s.i.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
    - name: longhorn-https
      protocol: HTTPS
      port: 443
      hostname: longhorn.k3s.i.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: longhorn-internal-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: influxdb2-https
      protocol: HTTPS
      port: 443
      hostname: influxdb2.k3s.i.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: influxdb2-internal-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: loki-https
      protocol: HTTPS
      port: 443
      hostname: loki.k3s.i.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: loki-internal-cert
      allowedRoutes:
        namespaces:
          from: All
---
####################################################################
# External gateway — replaces core/external-ingress.
# LoadBalancer IP 10.13.2.35 (external-ingress-address), public *.${DOMAIN}.
# externalTrafficPolicy: Local preserves the real client source IP.
####################################################################
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: external-proxy
  namespace: nginx-gateway
spec:
  kubernetes:
    service:
      type: LoadBalancer
      patches:
        - type: StrategicMerge
          value:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: external-ingress-address
            spec:
              externalTrafficPolicy: Local
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-external
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: external-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-stabl-one-cert
      allowedRoutes:
        namespaces:
          from: All
