# HTTP->HTTPS redirect on the :80 listener of each gateway.
# Replaces the (intended) nginx.ingress force-ssl-redirect behaviour.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-internal
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: nginx-internal
      sectionName: http
  hostnames:
    - "*.k3s.i.${DOMAIN}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-external
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: nginx-external
      sectionName: http
  hostnames:
    - "*.${DOMAIN}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
