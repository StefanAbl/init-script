# Serves the maintenance page for every request with HTTP 503.
server {
    listen 8080;
    server_name _;

    # Any path (incl. WebDAV/API calls from the sync clients) -> 503 + page.
    # error_page rewrites non-GET/HEAD methods to GET, so POST/PROPFIND work too.
    error_page 503 /_maintenance/index.html;

    location / {
        return 503;
    }

    location ^~ /_maintenance/ {
        internal;
        alias /usr/share/nginx/html/;
        add_header Retry-After "Wed, 21 Oct 2026 18:00:00 GMT" always;
        add_header Cache-Control "no-store" always;
    }
}

# Probe endpoint, not exposed via the Service.
server {
    listen 8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
