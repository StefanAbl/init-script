apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-maintenance
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-maintenance
  template:
    metadata:
      labels:
        app: nextcloud-maintenance
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: html
          configMap:
            name: nextcloud-maintenance-html
        - name: conf
          configMap:
            name: nextcloud-maintenance-nginx
        - name: tmp
          emptyDir: {}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-maintenance
  namespace: nextcloud
spec:
  selector:
    app: nextcloud-maintenance
  ports:
    - name: http
      port: 80
      targetPort: http
