apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - lg-cronjob
  - docsrv
  - unifi
  - coredns
  # docsrv and unifi both serve from the external gateway now; nothing in this
  # namespace is routed via nginx-internal.
  - ../../policies/allow-from-external-ingress.yml
  - ../../policies/allow-to-dns.yml
  - ../../policies/allow-to-internet.yml
  - ../../policies/allow-to-ipa-dns.yml
  - allow-from-db.yml
