apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  namespace: default
spec:
  parentRefs:
    - name: nginx-external
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - unifi.${DOMAIN}
  rules:
    - filters:
        # Restores the headers the removed external proxy applied to every public
        # vhost (ansible/roles/external_proxy/files/ssl.conf). `set` overwrites,
        # matching that config's proxy_hide_header + add_header pairing.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: same-origin
              - name: X-XSS-Protection
                value: "1; mode=block"
              - name: X-Frame-Options
                value: SAMEORIGIN
      backendRefs:
        - name: unifi
          port: 8443
---
# proxy-body-size: "0" -> allow arbitrarily large UniFi backup uploads.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: unifi-body-size
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: unifi
  body:
    maxSize: "0"
---
# backend-protocol: HTTPS -> the UniFi UI is HTTPS-only on :8443. The UniFi
# container generates its own self-signed cert in the PVC (it cannot be given
# an external CA-issued cert), and NGF has no skip-verify. So this policy pins
# that exact self-signed cert as the trust anchor (unifi-backend-ca ConfigMap).
#
# The served cert is self-signed with subject/issuer CN=unifi and SAN DNS:unifi
# (confirmed via `openssl s_client -connect 127.0.0.1:8443`). nginx verifies the
# backend name against the SAN, so `hostname: unifi` matches. The leaf is its own
# root, so it is pinned directly as the trust anchor (unifi-backend-ca ConfigMap).
# NOTE(migration): if UniFi ever regenerates its cert (e.g. data reset), the
# pinned PEM in unifi-backend-ca.pem must be re-captured.
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: unifi
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: unifi
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: unifi-backend-ca
    hostname: unifi
