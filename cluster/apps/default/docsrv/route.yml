apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-server
  namespace: default
spec:
  parentRefs:
    - name: nginx-external
      namespace: nginx-gateway
      sectionName: https
  # The request Host is already docsrv.${DOMAIN}, which NGF forwards to the
  # backend unchanged — this replaces the old upstream-vhost annotation.
  hostnames:
    - docsrv.${DOMAIN}
  rules:
    - backendRefs:
        - name: document-server
          port: 80
