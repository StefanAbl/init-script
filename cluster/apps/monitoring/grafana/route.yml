apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: nginx-external
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - grafana.${DOMAIN}
  rules:
    - backendRefs:
        - name: grafana
          port: 80
