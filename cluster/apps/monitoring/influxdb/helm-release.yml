apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb2
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://helm.influxdata.com/
      chart: influxdb2
      version: 2.1.2
      sourceRef:
        kind: HelmRepository
        name: influxdata
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    persistence:
      enabled: true
      useExisting: true
      name: influxdb2-longhorn
    # Ingress replaced by an internal HTTPRoute (route.yml) on the nginx-internal
    # gateway; TLS/cert handled by the gateway's influxdb2-https listener.
    ingress:
      enabled: false
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 125m
        memory: 250Mi

    # Security
    podAnnotations:
      container.apparmor.security.beta.kubernetes.io/influxdb2: runtime/default
      seccomp.security.alpha.kubernetes.io/pod: runtime/default

    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          -  ALL
