apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb2
  namespace: monitoring
spec:
  parentRefs:
    - name: nginx-internal
      namespace: nginx-gateway
      sectionName: influxdb2-https
  hostnames:
    - influxdb2.k3s.i.${DOMAIN}
  rules:
    - backendRefs:
        - name: influxdb2
          port: 80
