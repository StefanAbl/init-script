apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: loki-distributed
      version: 0.72.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    ingester:
      replicas: 3
      maxUnavailable: 1
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/ingester: runtime/default
      resources:
        limits:
          cpu: 500m
          memory: 750Mi
        requests:
          cpu: 100m
          memory: 500Mi
    querier:
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/querier: runtime/default
      replicas: 3
      maxUnavailable: 1
      nodeSelector:
        worker: "true"
      resources:
        limits:
          cpu: 2
          memory: 2048Mi
        requests:
          cpu: 50m
          memory: 300Mi
    distributor:
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/distributor: runtime/default
      nodeSelector:
        worker: "true"
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 100m
          memory: 200Mi
    compactor:
      enabled: true
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/compactor: runtime/default
      nodeSelector:
        worker: "true"
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 100m
          memory: 200Mi
    queryFrontend:
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/query-frontend: runtime/default
      nodeSelector:
        worker: "true"
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 100m
          memory: 200Mi
    gateway:
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/nginx: runtime/default
      nodeSelector:
        worker: "true"
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 100m
          memory: 200Mi
      nginxConfig:
        httpSnippet: |
          proxy_read_timeout 600s;
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
          send_timeout 600s;
      # Basic-auth is now terminated by Loki's own nginx gateway (replaces the
      # ingress-nginx auth-map annotations). existingSecret holds a multi-user
      # .htpasswd file. NOTE: this now also applies to internal clients — Promtail
      # push and the Grafana Loki datasource must send credentials.
      basicAuth:
        enabled: true
        existingSecret: loki-basic-auth

    loki:
      containerSecurityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        allowPrivilegeEscalation: false
        privileged: false
      podAnnotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      config: |
        common:
          compactor_address: http://{{ include "loki.compactorFullname" . }}:3100
        auth_enabled: false

        server:
          log_level: info #TODO: REDUCE
          # Must be set to 3100
          http_listen_port: 3100
          http_server_read_timeout: 15m
          http_server_write_timeout: 15m

        distributor:
          ring:
            kvstore:
              store: memberlist

        ingester:
          # Disable chunk transfer which is not possible with statefulsets
          # and unnecessary for boltdb-shipper
          max_transfer_retries: 0
          chunk_idle_period: 1h
          chunk_target_size: 1536000
          max_chunk_age: 1h
          lifecycler:
            join_after: 0s
            ring:
              kvstore:
                store: memberlist
          wal:
            dir: /var/loki/wal
        querier:
          engine:
            timeout: 15m
        memberlist:
          join_members:
            - {{ include "loki.fullname" . }}-memberlist
        limits_config:
          query_timeout: 15m
          split_queries_by_interval: 15m
          ingestion_rate_mb: 10
          ingestion_burst_size_mb: 20
          max_concurrent_tail_requests: 20
          max_cache_freshness_per_query: 10m
          retention_period: 720h # 30 days
        compactor:
          shared_store: s3
          retention_enabled: true
          retention_delete_delay: 2h
          retention_delete_worker_count: 150

        schema_config:
          configs:
            - from: 2020-09-07
              store: boltdb-shipper
              object_store: aws
              schema: v11
              index:
                prefix: loki_index_
                period: 24h

        storage_config:
          aws:
            s3: http://${LOKI_MINIO_USER}:${LOKI_MINIO_PASS}@versitygw.monitoring.svc.cluster.local.:7070/loki
            region: us-east-1
            insecure: true
            s3forcepathstyle: true
          boltdb_shipper:
            active_index_directory: /var/loki/index
            shared_store: s3
            cache_location: /var/loki/cache

        query_range:
          # make queries more cache-able by aligning them with their step intervals
          align_queries_with_step: true
          max_retries: 5
          # parallelize queries in 15min intervals
          cache_results: true

          results_cache:
            cache:
              enable_fifocache: true
              embedded_cache:
                enabled: true
                ttl: 24h
        frontend_worker:
          frontend_address: {{ include "loki.queryFrontendFullname" . }}:9095
          #Empty line needed after endraw

        frontend:
          log_queries_longer_than: 5s
          compress_responses: true
