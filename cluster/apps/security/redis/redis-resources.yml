---
# ConfigMap for Redis configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: security
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    daemonize no
    supervised no
    loglevel notice
    databases 16
    save ""
    appendonly no
    dir /data

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: security
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis

---
# Single instance on purpose: Redis only holds Authelia sessions and nothing is
# persisted, so a restart just logs users out. The hand-rolled Sentinel setup
# this replaces split-brained (redis-0 re-elected itself after a failover).
# A Deployment (not a StatefulSet) is used so the pod gets rescheduled when its
# node goes unreachable instead of waiting for the old pod to be confirmed gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: security
spec:
  replicas: 1
  strategy:
    # Never run two instances side by side behind the Service.
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Evict from a dead node after 30s instead of the default 300s.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker01.i.stabl.one
                      - worker02.i.stabl.one
                      - worker03.i.stabl.one
      containers:
        - name: redis
          image: redis:8-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: data
          emptyDir: {}
