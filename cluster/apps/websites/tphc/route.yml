apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tphc
  namespace: websites
spec:
  parentRefs:
    - name: nginx-external
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - tphc.${DOMAIN}
  rules:
    - backendRefs:
        - name: tphc
          port: 8000
