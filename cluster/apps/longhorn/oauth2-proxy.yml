apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: longhorn
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      # Server-side OIDC calls (discovery, token redeem, JWKS) go to auth.${DOMAIN}.
      # Cluster DNS forwards to the nodes' resolver, which returns the public IP,
      # not the LAN split horizon, so those calls would hairpin out through the
      # router, and the NetworkPolicy below does not allow internet egress.
      # Pin the name to the external Gateway so the calls stay in-cluster. TLS
      # still validates: the gateway serves the *.${DOMAIN} wildcard for this SNI.
      hostAliases:
        - ip: 10.13.2.35
          hostnames:
            - auth.${DOMAIN}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.${DOMAIN}
            - --client-id=longhorn
            - --redirect-url=https://longhorn.k3s.i.${DOMAIN}/oauth2/callback
            # Reverse-proxy longhorn-frontend once authenticated (upstream mode).
            - --upstream=http://longhorn-frontend:80
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --cookie-secure=true
            - --email-domain=*
            - --skip-provider-button=true
            - --set-xauthrequest=true
          envFrom:
            - secretRef:
                name: oauth2-proxy
          ports:
            - containerPort: 4180
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: longhorn
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
# Allow the internal gateway data plane to reach oauth2-proxy, and oauth2-proxy
# to reach longhorn-frontend (same ns) and Authelia (security ns) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Scoped to the internal Gateway's data-plane pods: longhorn is internal-only,
    # so the external gateway must not be able to reach oauth2-proxy even though
    # both gateways share this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: nginx-internal
      ports:
        - port: 4180
          protocol: TCP
  egress:
    # longhorn-frontend (same namespace). Port 8000 is the UI pods' containerPort
    # (the Service's `http` targetPort), not the Service port 80: kube-router
    # evaluates egress after kube-proxy DNAT.
    - to:
        - podSelector:
            matchLabels:
              app: longhorn-ui
      ports:
        - port: 8000
          protocol: TCP
    # Authelia OIDC (security namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
      ports:
        - port: 80
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # auth.${DOMAIN} via the external Gateway (see hostAliases above).
    # Selects the data-plane pods, not ipBlock 10.13.2.35: kube-proxy DNATs the
    # LoadBalancer IP to a pod IP before k3s' kube-router evaluates egress policy,
    # so an ipBlock on the LB address never matches. Port 443 is the pods'
    # containerPort (the Service's targetPort), which is what is checked post-DNAT.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: nginx-external
      ports:
        - port: 443
          protocol: TCP
---
# allow-scraping selects every pod in this namespace with policyType Ingress,
# which isolates longhorn-ui: without this, only Prometheus (on 9500) may connect
# and oauth2-proxy's upstream requests time out (502 from oauth2-proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-from-oauth2-proxy
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - port: 8000
          protocol: TCP
