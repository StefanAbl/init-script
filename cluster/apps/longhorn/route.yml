apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn
spec:
  parentRefs:
    - name: nginx-internal
      namespace: nginx-gateway
      sectionName: longhorn-https
  hostnames:
    - longhorn.k3s.i.${DOMAIN}
  rules:
    # All traffic goes through oauth2-proxy, which authenticates via Authelia
    # OIDC and then proxies to longhorn-frontend.
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
