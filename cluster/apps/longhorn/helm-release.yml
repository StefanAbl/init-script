apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.longhorn.io
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 5m
  values:
    networkPolicies:
      enabled: true
      type: rke1
    csi:
      kubeletRootDir: /var/lib/kubelet
    persistence:
      defaultClassReplicaCount: 2
      reclaimPolicy: Retain
      defaultNodeSelector:
        enable: true
        selector: "worker"
    defaultSettings:
        backupTarget: s3://longhorn@us-east-1/
        backupTargetCredentialSecret: backup-secret
        storageMinimalAvailablePercentage: "20"
        concurrentReplicaRebuildPerNodeLimit: "1"
        fastReplicaRebuildEnabled: "true"
        snapshotDataIntegrity: fast-check
    # Ingress replaced by oauth2-proxy (Authelia OIDC) + an internal HTTPRoute.
    # The old nginx forward-auth annotations are re-expressed as an OIDC login
    # in front of longhorn-frontend; see apps/longhorn/oauth2-proxy.yml.
    ingress:
      enabled: false
