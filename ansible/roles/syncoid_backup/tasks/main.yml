- name: Install sanoid
  become: true
  package:
    name: sanoid
    state: present
- name: Template backup script
  become: yes
  template:
    src: "backup.sh"
    dest: "/etc/backup.sh"
    owner: root
    mode: '0750'
  vars:
    syncoid_backup_mail_user: noreply
    syncoid_backup_mail_user_password: "{{hetzner_mail_pw}}"
- name: Copy systemd files
  become: yes
  copy:
    src: "{{item}}"
    dest: /etc/systemd/system/
  with_items:
    - backup.service
    - backup.timer
- name: Start backup timer
  become: true
  systemd:
    name: backup.timer
    state: started
